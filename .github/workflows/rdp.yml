name: RDP with Tailscale

on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Get IP and Set Password
        run: |
          $ip = (tailscale ip -4).Trim()
          Write-Host "Tailscale IP: $ip"
          echo "IP=$ip" >> $env:GITHUB_ENV
          net user runneradmin MySecurePass@123

      - name: Display Connection Details
        run: |
          Write-Host "================================================"
          Write-Host "RDP IS READY"
          Write-Host "IP Address: $env:IP"
          Write-Host "Username  : runneradmin"
          Write-Host "Password  : MySecurePass@123"
          Write-Host "================================================"

      - name: Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
