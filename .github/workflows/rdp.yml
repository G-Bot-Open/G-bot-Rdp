name: RDP with Tailscale

on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Install Tailscale via winget
        run: |
          winget install Tailscale.Tailscale --silent --accept-package-agreements
      - name: Wait for installation and set PATH
        run: |
          # Refresh PATH environment variable
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
      - name: Connect Tailscale
        run: |
          tailscale up --auth-key ${{ secrets.TAILSCALE_AUTH_KEY }}
      - name: Get IP
        run: |
          tailscale ip -4
      - name: Set Windows Password
        run: |
          net user runneradmin MySecurePass@123
      - name: Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
