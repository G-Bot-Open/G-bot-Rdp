name: RDP with Tailscale

on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Download Tailscale MSI
        run: |
          curl -L -o tailscale.msi https://pkgs.tailscale.com/stable/windows/tailscale-amd64-1.102.2.msi
      - name: Install Tailscale
        run: |
          msiexec /i tailscale.msi /quiet /norestart
      - name: Connect Tailscale
        run: |
          & "C:\Program Files\Tailscale\Tailscale.exe" up --auth-key ${{ secrets.TAILSCALE_AUTH_KEY }}
      - name: Get IP
        run: |
          & "C:\Program Files\Tailscale\Tailscale.exe" ip -4
      - name: Set Windows Password
        run: |
          net user runneradmin MySecurePass@123
      - name: Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
