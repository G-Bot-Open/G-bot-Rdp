name: RDP with Tailscale

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password'
        required: true
        default: 'MySecurePass@123'

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tailscale Connect
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Enable RDP and Set Custom Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "${{ github.event.inputs.password }}"

      - name: Get Tailscale IP
        run: |
          $ip = (tailscale ip -4).Trim()
          Write-Host "IP=$ip" >> $env:GITHUB_ENV
          echo "IP=$ip"

      - name: Display Connection Details
        run: |
          Write-Host "================================================"
          Write-Host "✅ RDP IS READY"
          Write-Host "🌐 IP: $env:IP"
          Write-Host "👤 User: runneradmin"
          Write-Host "🔑 Pass: ${{ github.event.inputs.password }}"
          Write-Host "================================================"

      - name: Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
