name: RDP with Tailscale

on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Install Tailscale (official script)
        run: |
          Invoke-Expression (Invoke-WebRequest -Uri "https://tailscale.com/install.ps1" -UseBasicParsing).Content
      - name: Connect Tailscale
        run: |
          tailscale up --auth-key ${{ secrets.TAILSCALE_AUTH_KEY }}
      - name: Get IP
        run: |
          tailscale ip -4
      - name: Set Windows Password
        run: |
          net user runneradmin MySecurePass@123
      - name: Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
