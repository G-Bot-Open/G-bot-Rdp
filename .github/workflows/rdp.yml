name: RDP with Tailscale

on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Download Tailscale installer
        run: |
          curl -L -o tailscale.exe https://tailscale.com/download/windows
          # Check size
          $size = (Get-Item tailscale.exe).Length
          if ($size -lt 1000000) { Write-Error "Download failed"; exit 1 }
      - name: Install Tailscale silently
        run: |
          Start-Process -FilePath ".\tailscale.exe" -ArgumentList "/S" -Wait
          # Refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
      - name: Connect Tailscale
        run: |
          tailscale up --auth-key ${{ secrets.TAILSCALE_AUTH_KEY }}
      - name: Get IP
        run: |
          $ip = tailscale ip -4
          Write-Host "IP: $ip"
          echo "IP=$ip" >> $env:GITHUB_ENV
      - name: Set RDP password
        run: |
          net user runneradmin MySecurePass@123
      - name: Keep alive
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
