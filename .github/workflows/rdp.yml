name: RDP with Tailscale

on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tailscale Connect
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Enable RDP and Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin MySecurePass@123

      - name: Get Tailscale IP
        run: |
          $ip = (tailscale ip -4).Trim()
          Write-Host "================================================"
          Write-Host "✅ RDP IS READY"
          Write-Host "🌐 IP Address: $ip"
          Write-Host "👤 Username  : runneradmin"
          Write-Host "🔑 Password  : MySecurePass@123"
          Write-Host "⏳ Session active for ~6 hours."
          Write-Host "================================================"
          echo "IP=$ip" >> $env:GITHUB_ENV

      - name: Keep Alive (DO NOT CANCEL)
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
