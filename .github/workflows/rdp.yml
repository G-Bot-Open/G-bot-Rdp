name: RDP with Tailscale

on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Install Tailscale
        run: |
          curl -L -o tailscale.exe https://pkgs.tailscale.com/stable/windows/tailscale-setup-1.76.6.exe
          ./tailscale.exe /S
      - name: Connect Tailscale
        run: |
          & "C:\Program Files\Tailscale\Tailscale.exe" up --auth-key ${{ secrets.TAILSCALE_AUTH_KEY }}
      - name: Get IP
        run: |
          & "C:\Program Files\Tailscale\Tailscale.exe" ip -4
      - name: Set Windows Password
        run: |
          net user runneradmin MySecurePass@123
      - name: Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
